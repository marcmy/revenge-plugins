name: Apply review fixes

on:
  push:
    branches:
      - fix/address-codex-review-feedback

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/address-codex-review-feedback
          fetch-depth: 0
      - name: Apply prepared review fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/reviewfix.patch
          git apply /tmp/reviewfix.patch
          rm -f .github/workflows/apply-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/BetterChatCopy/src/index.tsx plugins/SplitLargeMessages/src/stableEntry2.ts plugins/SplitLargeMessages/src/markdownSplitter.ts .github/workflows/apply-review-fixes.yml
          git commit -m "fix: address second Codex review"
          git push origin HEAD:fix/address-codex-review-feedback
