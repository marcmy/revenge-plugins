name: Validate commonjs Rollup 4 prep

on:
  push:
    branches:
      - chore/commonjs-rollup4

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/commonjs-rollup4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build plugins
        run: npm run build
      - name: Remove temporary validation workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-commonjs-rollup4.yml
          git commit -m "ci: remove temporary commonjs validation"
          git push origin HEAD:chore/commonjs-rollup4
