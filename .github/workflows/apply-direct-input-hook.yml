name: Apply direct input hook

on:
  push:
    branches:
      - fix/split-large-message-direct-input-hook

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/split-large-message-direct-input-hook
          fetch-depth: 0
      - name: Apply direct live ChatInput patch
        shell: bash
        run: |
          cat .github/reviewfix/direct.patch.b64.* | base64 -d > /tmp/direct.patch
          git apply /tmp/direct.patch
          rm -rf .github/reviewfix .github/workflows/apply-direct-input-hook.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SplitLargeMessages/src/stableEntry2.ts .github
          git diff --cached --check
          git commit -m "fix: patch live ChatInput send methods directly"
          git push origin HEAD:fix/split-large-message-direct-input-hook
