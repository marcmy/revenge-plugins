name: Revert BetterChatCopy emoji workarounds

on:
  push:
    branches:
      - revert/better-chat-copy-emoji-workarounds

permissions:
  contents: write

jobs:
  revert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: revert/better-chat-copy-emoji-workarounds
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Restore original custom emoji formatting
        run: python .github/reviewfix/revert-bcc-emoji.py
      - name: Commit revert and remove helper
        shell: bash
        run: |
          rm -rf .github/reviewfix .github/workflows/revert-bcc-emoji.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/BetterChatCopy/src/index.tsx .github
          git diff --cached --check
          git commit -m "revert: restore BetterChatCopy emoji formatting"
          git push origin HEAD:revert/better-chat-copy-emoji-workarounds
