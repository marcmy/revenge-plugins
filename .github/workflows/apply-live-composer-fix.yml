name: Apply live composer fix

on:
  push:
    branches:
      - fix/split-large-message-input-ref

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/split-large-message-input-ref
          fetch-depth: 0
      - name: Apply live composer patch
        shell: bash
        run: |
          printf '\n' >> .github/reviewfix/live-composer.patch
          git apply .github/reviewfix/live-composer.patch
          rm -rf .github/reviewfix .github/workflows/apply-live-composer-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/SplitLargeMessages/src/stableEntry2.ts .github
          git diff --cached --check
          git commit -m "fix: intercept live mobile composer send"
          git push origin HEAD:fix/split-large-message-input-ref
