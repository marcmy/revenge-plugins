name: Apply BetterChatCopy emoji fix

on:
  push:
    branches:
      - fix/better-chat-copy-inline-emojis

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/better-chat-copy-inline-emojis
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Preserve inline custom emoji markup
        run: python .github/reviewfix/fix-better-chat-copy-emojis.py
      - name: Commit fix and remove helper
        shell: bash
        run: |
          rm -rf .github/reviewfix .github/workflows/apply-better-chat-copy-emoji-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/BetterChatCopy/src/index.tsx .github
          git diff --cached --check
          git commit -m "fix: preserve custom emoji positions when copying"
          git push origin HEAD:fix/better-chat-copy-inline-emojis
